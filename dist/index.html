<title>BrandLens</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* BrandLens: a proofreader's desk. Ink-black interface, the red pen is the only loud colour. */
:root {
  --bg: #F3F4F7; --surface: #FFFFFF; --surface-2: #ECEEF3; --ink: #12151C; --ink-2: #444B59; --ink-3: #5E6675;
  --line: #D9DDE6; --accent: #2848D8; --pen: #CF2F1B;
  --high: #BE2424; --med: #A25F00; --low: #2459C9; --ok: #17744A;
  --high-bg: #FCEBE9; --med-bg: #FFF1D6; --low-bg: #E7EFFD; --ok-bg: #E2F4EA;
  --btn: #12151C; --btn-ink: #FFFFFF; --shadow: 0 1px 2px rgba(18,21,28,.06), 0 6px 20px rgba(18,21,28,.05);
  --f-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D0F14; --surface: #151922; --surface-2: #1D222D; --ink: #EDEFF4; --ink-2: #B6BCC9; --ink-3: #8F97A6;
    --line: #2A303D; --accent: #8AA4FF; --pen: #FF6F5B;
    --high: #FF8077; --med: #F2B456; --low: #86AEFF; --ok: #55D391;
    --high-bg: #3A1B1A; --med-bg: #3A2B12; --low-bg: #172844; --ok-bg: #123424;
    --btn: #EDEFF4; --btn-ink: #12151C; --shadow: 0 1px 2px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D0F14; --surface: #151922; --surface-2: #1D222D; --ink: #EDEFF4; --ink-2: #B6BCC9; --ink-3: #8F97A6;
  --line: #2A303D; --accent: #8AA4FF; --pen: #FF6F5B;
  --high: #FF8077; --med: #F2B456; --low: #86AEFF; --ok: #55D391;
  --high-bg: #3A1B1A; --med-bg: #3A2B12; --low-bg: #172844; --ok-bg: #123424;
  --btn: #EDEFF4; --btn-ink: #12151C; --shadow: 0 1px 2px rgba(0,0,0,.4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14.5px/1.55 var(--f-body); padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
h1, h2, h3, h4 { font-family: var(--f-display); margin: 0; line-height: 1.15; text-wrap: balance; }
h1 { font-size: 28px; font-weight: 700; letter-spacing: -.01em; }
h2 { font-size: 20px; font-weight: 700; } h3 { font-size: 16px; font-weight: 650; } h4 { font-size: 14.5px; font-weight: 650; font-family: var(--f-body); }
p { margin: 0; } a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.muted { color: var(--ink-3); } .small { font-size: 12.5px; } .tiny { font-size: 12px; }
.mono { font-family: var(--f-mono); } .good { color: var(--ok); } .bad { color: var(--high); }
.empty { padding: 28px 12px; text-align: center; color: var(--ink-3); }

/* top bar */
#top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
.top-in { max-width: 1240px; margin: 0 auto; padding: 10px max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: 8px; color: var(--ink); text-decoration: none; font-family: var(--f-display); font-weight: 800; font-size: 20px; letter-spacing: -.02em; }
.pen-dot { fill: var(--pen); }
nav { display: flex; gap: 2px; overflow-x: auto; }
nav a { padding: 7px 12px; border-radius: 8px; color: var(--ink-2); text-decoration: none; font-weight: 500; white-space: nowrap; }
nav a:hover { background: var(--surface-2); }
nav a[aria-current] { color: var(--ink); background: var(--surface-2); font-weight: 600; box-shadow: inset 0 -2px 0 var(--pen); }
.roles { margin-left: auto; display: flex; gap: 4px; background: var(--surface-2); padding: 3px; border-radius: 10px; }
.role { border: 0; background: transparent; padding: 5px 12px; border-radius: 8px; cursor: pointer; text-align: left; line-height: 1.2; display: flex; flex-direction: column; }
.role small { color: var(--ink-3); font-size: 11.5px; } .role b { font-size: 13px; }
.role.on { background: var(--surface); box-shadow: var(--shadow); } .role.on b { color: var(--ink); }

.wrap { max-width: 1240px; margin: 0 auto; padding: 22px max(16px, env(safe-area-inset-left, 0px)) 80px; padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; }
.wrap.narrow { max-width: 860px; }
.page-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.page-h p { margin-top: 6px; max-width: 70ch; } .page-h.tight { align-items: center; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }

/* buttons, chips */
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 9px; cursor: pointer; font-weight: 600; font-size: 13.5px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); } .btn.primary:hover { opacity: .88; background: var(--btn); }
.btn.danger { color: var(--high); border-color: var(--high); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); } .btn.ghost:hover { background: var(--surface-2); }
.btn.sm { padding: 5px 10px; font-size: 12.5px; border-radius: 8px; }
.btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
.btn.file { cursor: pointer; } .btn.file input { display: none; }
.lnk { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; font: inherit; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.fchip { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 99px; cursor: pointer; font-size: 13px; color: var(--ink-2); }
.fchip b { color: var(--ink); margin-left: 3px; } .fchip.on { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); } .fchip.on b { color: inherit; }
.chips.sm .fchip { padding: 3px 10px; font-size: 12.5px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; padding: 1px 8px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); font-weight: 500; }
.chip.ai { background: var(--low-bg); color: var(--low); } .chip.conf { background: var(--surface-2); }
.chip.sub-contradicts { background: var(--high-bg); color: var(--high); } .chip.sub-unverified { background: var(--med-bg); color: var(--med); } .chip.sub-outdated { background: var(--med-bg); color: var(--med); }
.pill { font-size: 12px; font-weight: 650; padding: 3px 11px; border-radius: 99px; white-space: nowrap; }
.st-draft { background: var(--surface-2); color: var(--ink-2); } .st-review { background: var(--low-bg); color: var(--low); }
.st-changes { background: var(--med-bg); color: var(--med); } .st-ok { background: var(--ok-bg); color: var(--ok); } .st-rej { background: var(--high-bg); color: var(--high); }
.rchip { font-size: 11px; padding: 1px 8px; border-radius: 6px; font-weight: 650; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.r-manager { background: var(--ink); color: var(--bg); } .r-reviewer { background: var(--med-bg); color: var(--med); } .r-creator { background: var(--low-bg); color: var(--low); }
.chk { display: flex; align-items: center; gap: 8px; cursor: pointer; } .chk input { width: 16px; height: 16px; accent-color: var(--accent); }
.row-gap { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* forms */
label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
label.chk, label.btn { font-weight: 500; flex-direction: row; }
input, select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; font-weight: 400; color: var(--ink); }
input[type=checkbox], input[type=color] { width: auto; padding: 0; }
textarea { resize: vertical; line-height: 1.5; }
input:disabled, select:disabled, textarea:disabled { opacity: .6; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; } .form-grid .wide { grid-column: 1 / -1; }
.form-grid.inline { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 4px; }
.note { background: var(--med-bg); color: var(--ink); padding: 8px 12px; border-radius: 8px; font-size: 13px; }

/* tour */
.tour { background: var(--surface); border-left: 4px solid var(--pen); }
.tour-h { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.steps li { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.steps .n { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; color: var(--ink-2); }
.steps li.done .n { background: var(--ok); border-color: var(--ok); color: #fff; } .steps li.done > span:nth-child(2) { color: var(--ink-3); text-decoration: line-through; }
.tour-f { display: flex; justify-content: space-between; align-items: center; }

/* queue */
.list { display: flex; flex-direction: column; gap: 8px; }
.rowc { display: grid; grid-template-columns: minmax(0, 1fr) auto auto 90px; gap: 16px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; cursor: pointer; width: 100%; }
.rowc:hover { border-color: var(--ink-3); } .r-main { display: flex; flex-direction: column; min-width: 0; } .r-main b { font-size: 15px; } .r-main small { color: var(--ink-3); }
.r-sev { display: flex; gap: 10px; align-items: center; min-width: 70px; } .dotc { display: inline-flex; align-items: center; gap: 4px; font-weight: 650; font-size: 13px; }
.dotc i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); } .dotc.high { --c: var(--high); } .dotc.medium { --c: var(--med); } .dotc.low { --c: var(--low); }
.clean { color: var(--ok); display: inline-flex; gap: 4px; align-items: center; font-weight: 600; }
.r-st { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; } .wf { font-size: 11.5px; color: var(--pen); font-style: normal; font-weight: 650; }
.r-t { font-size: 12.5px; text-align: right; }
@media (max-width: 760px) { .rowc { grid-template-columns: 1fr auto; } .r-t { display: none; } .r-sev { grid-column: 1; } .r-st { grid-row: 1; grid-column: 2; } }

/* review layout */
.r-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(340px, 1fr); gap: 18px; align-items: start; }
.r-left { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.r-right { position: sticky; top: calc(76px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 96px); overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 4px; }
@media (max-width: 980px) { .r-grid { grid-template-columns: 1fr; } .r-right { position: static; max-height: none; overflow: visible; } }
.goal { display: flex; gap: 10px; align-items: center; } .goal .k { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 650; flex: none; }
.goal-in { border: 0; border-bottom: 1px dashed var(--line); border-radius: 0; padding: 4px 0; background: transparent; }
.draft { white-space: pre-wrap; word-break: break-word; line-height: 1.75; font-size: 15.5px; padding: 14px 16px; background: var(--bg); border-radius: 10px; border: 1px solid var(--line); }
.draft-ta { font-size: 15.5px; line-height: 1.7; }
.mk { --c: var(--low); background: color-mix(in srgb, var(--c) 10%, transparent); text-decoration: underline wavy var(--c); text-decoration-thickness: 1.6px; text-underline-offset: 5px; cursor: pointer; border-radius: 3px; color: inherit; }
.mk.high { --c: var(--high); } .mk.medium { --c: var(--med); } .mk.low { --c: var(--low); }
.mk.done { text-decoration: none; background: none; border-bottom: 1px dotted var(--ink-3); }
.mk.on { background: color-mix(in srgb, var(--c) 28%, transparent); outline: 2px solid var(--c); outline-offset: 1px; }
.meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.meter { padding: 12px 16px; display: flex; flex-direction: column; border-right: 1px solid var(--line); min-width: 0; } .meter:last-child { border-right: 0; }
.meter .k { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); font-weight: 650; }
.meter b { font-family: var(--f-display); font-size: 26px; font-variant-numeric: tabular-nums; line-height: 1.2; } .meter .of { font-size: 15px; color: var(--ink-3); } .meter small { color: var(--ink-3); font-size: 12px; }
.vgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; } .vcol { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.thumb { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); } .thumb img { display: block; width: 100%; } .thumb-empty { padding: 28px; text-align: center; color: var(--ink-3); font-size: 13px; }
.pal { display: flex; gap: 8px; flex-wrap: wrap; } .sw { display: flex; flex-direction: column; align-items: center; font-size: 12px; gap: 1px; } .sw i { width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--line); } .sw small { font-size: 11px; }
.cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .colorin { display: flex; gap: 6px; } .colorin input[type=color] { width: 40px; height: 36px; flex: none; border: 1px solid var(--line); border-radius: 8px; background: none; } .hex { font-family: var(--f-mono); }
.contrast { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bgc); } .contrast > span:last-child { background: var(--surface); padding: 4px 10px; border-radius: 6px; font-size: 13px; }
.contrast .sample { font-family: var(--f-display); font-size: 28px; font-weight: 800; color: var(--fg); } .contrast em { font-style: normal; font-weight: 650; }

/* findings */
.fp-h { display: flex; justify-content: space-between; align-items: baseline; }
.safe .btn { white-space: nowrap; }
.safe { display: flex; gap: 10px; align-items: center; justify-content: space-between; background: var(--ok-bg); padding: 9px 12px; border-radius: 10px; font-size: 13px; }
.aip { border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; } .aip-h { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; } .aip-b { background: var(--surface-2); padding: 10px 12px; border-radius: 8px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.sent { white-space: pre-wrap; font-family: var(--f-mono); font-size: 12px; margin: 0; max-height: 150px; overflow: auto; background: var(--surface); padding: 8px; border-radius: 6px; }
.fc { --c: var(--low); background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow); scroll-margin: 100px; }
.fc.high { --c: var(--high); } .fc.medium { --c: var(--med); } .fc.low { --c: var(--low); }
.fc.on { outline: 2px solid var(--c); } .fc.flash { animation: fl 1.2s ease; } @keyframes fl { 0% { background: color-mix(in srgb, var(--c) 22%, var(--surface)); } 100% { background: var(--surface); } }
.fc.resolved { opacity: .78; border-left-color: var(--line); box-shadow: none; }
.fc-h { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.sev { font-size: 11px; font-weight: 750; text-transform: uppercase; letter-spacing: .06em; color: var(--c); }
.rid { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); margin-left: auto; }
.quote { font-family: var(--f-mono); font-size: 12.5px; background: var(--surface-2); padding: 5px 8px; border-radius: 6px; word-break: break-word; }
.why { color: var(--ink-2); font-size: 13.5px; }
.src { display: flex; gap: 8px; font-size: 12.5px; color: var(--ink-3); background: var(--bg); border-radius: 8px; padding: 7px 9px; } .cid { font-family: var(--f-mono); font-size: 11.5px; font-weight: 600; color: var(--ink); background: var(--surface-2); padding: 0 6px; border-radius: 4px; height: fit-content; white-space: nowrap; }
.fix { display: flex; flex-direction: column; gap: 3px; } .ba { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: 13.5px; }
del { color: var(--high); background: var(--high-bg); text-decoration: line-through; padding: 0 3px; border-radius: 3px; } ins { color: var(--ok); background: var(--ok-bg); text-decoration: none; padding: 0 3px; border-radius: 3px; } ins.gone { font-style: italic; }
.arr { color: var(--ink-3); } .keep { font-size: 12.5px; color: var(--ink-3); }
.fc-a { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.dis { background: var(--surface-2); padding: 10px; border-radius: 8px; display: flex; flex-direction: column; gap: 8px; }
.so { font-size: 12.5px; display: flex; gap: 5px; align-items: center; font-weight: 600; } .so.ok { color: var(--ok); } .so.wait { color: var(--med); }
.allclear { text-align: center; padding: 26px 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 1px dashed var(--line); border-radius: 10px; } .allclear .big { width: 40px; height: 40px; border-radius: 50%; background: var(--ok-bg); color: var(--ok); display: grid; place-items: center; }

/* discussion */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: -4px 0 4px; } .tabs.scroll { overflow-x: auto; margin: 0; }
.tab { border: 0; background: none; padding: 9px 14px; cursor: pointer; color: var(--ink-3); font-weight: 600; border-bottom: 2px solid transparent; white-space: nowrap; } .tab.on { color: var(--ink); border-bottom-color: var(--pen); }
.cm { padding: 8px 0; border-bottom: 1px solid var(--line); } .cm-h { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.composer { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; margin-top: 6px; }
.vers { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; } .vers li { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
.difft { white-space: pre-wrap; line-height: 1.7; background: var(--bg); padding: 10px 12px; border-radius: 8px; margin-top: 6px; }
.audit { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; } .audit li { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; }
.abar { position: sticky; bottom: 0; z-index: 5; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; box-shadow: 0 -4px 18px rgba(18,21,28,.08); margin-bottom: env(safe-area-inset-bottom, 0px); }
.ab-msg { flex: 1 1 220px; font-size: 13px; color: var(--ink-2); display: flex; gap: 6px; align-items: center; } .ab-msg.ok { color: var(--ok); font-weight: 600; } .ab-msg.warn { color: var(--med); font-weight: 600; } .ab-msg.bad { color: var(--high); font-weight: 600; }
.ab-note { flex: 1 1 100%; } .ab-note textarea { min-height: 38px; }

/* kit */
.grp { margin: 10px 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); } .grp:first-child { margin-top: 0; }
.clauses { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; }
.clause { display: flex; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; scroll-margin: 100px; } .clause p { color: var(--ink-2); font-size: 13.5px; margin-top: 2px; } .clause.flash { animation: fl2 1.6s ease; }
@keyframes fl2 { 0%,60% { background: var(--med-bg); } 100% { background: transparent; } }
.rules { margin-top: 6px; font-size: 12px; color: var(--ink-3); display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.tw { overflow-x: auto; } table { border-collapse: collapse; width: 100%; font-size: 13.5px; } th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); } th, td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }

<div id="toast" role="status" aria-live="polite"></div>
<script>
/*  BrandLens review engine
 *  Pure functions, no DOM. Runs in the browser and in Node (see tests/).
 *  Every finding cites a guideline clause or an approved source from the Brand Kit.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.BrandLensEngine = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const SEV = { high: 3, medium: 2, low: 1 };

  /* Rule catalogue: label, category and the clause the rule enforces. */
  const RULES = {
    'TERM-CUST': { label: 'Customers / users → members', category: 'terminology', clause: 'T-2.1' },
    'TERM-NAME': { label: 'Product naming', category: 'terminology', clause: 'T-2.2' },
    'TERM-CAP': { label: 'Brand name capitalisation', category: 'terminology', clause: 'T-2.3' },
    'TERM-GLO': { label: 'Glossary term', category: 'terminology', clause: 'T-2.1' },
    'TONE-HYPE': { label: 'Hype words', category: 'tone', clause: 'V-1.2' },
    'TONE-JARGON': { label: 'Corporate jargon', category: 'tone', clause: 'V-1.3' },
    'TONE-SLANG': { label: 'Slang in formal channel', category: 'tone', clause: 'V-1.4' },
    'TONE-CAPS': { label: 'ALL CAPS', category: 'tone', clause: 'V-1.2' },
    'TONE-EXCL': { label: 'Exclamation marks', category: 'tone', clause: 'V-1.2' },
    'CLM-SUP': { label: 'Unsupported ranking claim', category: 'claims', clause: 'C-4.1' },
    'CLM-NUM': { label: 'Unverified performance figure', category: 'claims', clause: 'C-4.1' },
    'CLM-ABS': { label: 'Absolute promise', category: 'claims', clause: 'C-4.1' },
    'CLM-PRO': { label: 'Prohibited claim', category: 'claims', clause: 'C-4.2' },
    'FACT-PRICE': { label: 'Price mismatch', category: 'facts', clause: 'F-5.1' },
    'FACT-USERS': { label: 'Member count mismatch', category: 'facts', clause: 'F-5.1' },
    'FACT-YEAR': { label: 'Launch year mismatch', category: 'facts', clause: 'F-5.1' },
    'FACT-FREE': { label: 'Free plan limit mismatch', category: 'facts', clause: 'F-5.1' },
    'FACT-TRIAL': { label: 'Trial length mismatch', category: 'facts', clause: 'F-5.1' },
    'MSG-FIN': { label: 'Finance disclaimer missing', category: 'messaging', clause: 'M-3.1' },
    'MSG-TERMS': { label: 'Offer terms missing', category: 'messaging', clause: 'M-3.2' },
    'MSG-NAME': { label: 'Full product name on first mention', category: 'messaging', clause: 'M-3.3' },
    'A11Y-READ': { label: 'Reading level', category: 'accessibility', clause: 'A-6.1' },
    'A11Y-LONG': { label: 'Very long sentence', category: 'accessibility', clause: 'A-6.1' },
    'A11Y-HASH': { label: 'Hashtag not CamelCase', category: 'accessibility', clause: 'A-6.2' },
    'A11Y-LINK': { label: 'Vague link text', category: 'accessibility', clause: 'A-6.2' },
    'A11Y-EMOJI': { label: 'Emoji overuse', category: 'accessibility', clause: 'A-6.2' },
    'A11Y-ALT': { label: 'Image alt text', category: 'accessibility', clause: 'A-6.2' },
    'A11Y-CON': { label: 'Colour contrast', category: 'accessibility', clause: 'A-6.3' },
    'VIS-PAL': { label: 'Off-palette colour', category: 'visual', clause: 'VI-7.1' },
    'VIS-LOGO': { label: 'Logo usage', category: 'visual', clause: 'VI-7.2' },
    'CONF-PII': { label: 'Confidential or personal data', category: 'confidentiality', clause: 'P-8.1' },
    'AI-REV': { label: 'AI second opinion', category: 'tone', clause: 'V-1.1' },
  };

  const CATEGORIES = ['tone', 'terminology', 'messaging', 'facts', 'claims', 'accessibility', 'visual', 'confidentiality'];

  /* ---------- helpers ---------- */
  const escRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const phraseRe = (p, flags) =>
    new RegExp('(?<![\\w])' + escRe(p).replace(/-/g, '[- ]') + '(?![\\w])', flags || 'gi');
  const matchCase = (src, rep) =>
    rep && /^[A-Z]/.test(src) && /^[a-z]/.test(rep) ? rep[0].toUpperCase() + rep.slice(1) : rep;
  const fmtNum = (n) => Number(n).toLocaleString('en-IN');

  function F(o) {
    const meta = RULES[o.rule] || {};
    const f = Object.assign(
      { start: -1, end: -1, text: '', fix: null, keep: '', conf: 1, source: 'rule', safe: false, noDismiss: false, sub: null },
      { category: meta.category, clause: meta.clause },
      o
    );
    f.key = f.rule + '|' + (f.text || f.title || '').toLowerCase();
    f.id = f.rule + ':' + f.start + ':' + f.end + ':' + (f.source === 'ai' ? 'ai' : 'r');
    return f;
  }

  function protectedRanges(text) {
    const r = [];
    const re = /https?:\/\/\S+|\b[\w.+-]+@[\w-]+(?:\.[\w-]+)+|[#@][A-Za-z]\w*/g;
    for (const m of text.matchAll(re)) r.push([m.index, m.index + m[0].length]);
    return r;
  }
  const overlaps = (ranges, s, e) => ranges.some(([a, b]) => s < b && e > a);

  function sentences(text) {
    const out = [];
    for (const m of text.matchAll(/[^.!?\n]+[.!?]*/g)) {
      const lead = m[0].match(/^\s*/)[0].length;
      const t = m[0].trim();
      if (t) out.push({ start: m.index + lead, end: m.index + lead + t.length, text: t });
    }
    return out;
  }

  function syllables(word) {
    let w = word.toLowerCase().replace(/[^a-z]/g, '');
    if (!w) return 0;
    if (w.length <= 3) return 1;
    w = w.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/, '').replace(/^y/, '');
    const m = w.match(/[aeiouy]{1,2}/g);
    return m ? m.length : 1;
  }

  function readability(text) {
    const words = text.replace(/https?:\/\/\S+|[#@]\w+/g, ' ').match(/[A-Za-z][A-Za-z'’-]*/g) || [];
    const sents = sentences(text.replace(/https?:\/\/\S+/g, ' ')).length || 1;
    const syl = words.reduce((n, w) => n + syllables(w), 0);
    const score = words.length ? 206.835 - 1.015 * (words.length / sents) - 84.6 * (syl / words.length) : 100;
    return { score: Math.round(score), words: words.length, sentences: sents };
  }

  /* ---------- colour maths (WCAG + Lab) ---------- */
  function hexToRgb(h) {
    if (typeof h !== 'string') return null;
    let x = h.trim().replace('#', '');
    if (x.length === 3) x = x.split('').map((c) => c + c).join('');
    if (!/^[0-9a-fA-F]{6}$/.test(x)) return null;
    return [parseInt(x.slice(0, 2), 16), parseInt(x.slice(2, 4), 16), parseInt(x.slice(4, 6), 16)];
  }
  const rgbToHex = (r, g, b) =>
    '#' + [r, g, b].map((v) => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('').toUpperCase();
  function luminance(rgb) {
    const [r, g, b] = rgb.map((v) => {
      v /= 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  }
  function contrast(h1, h2) {
    const a = hexToRgb(h1), b = hexToRgb(h2);
    if (!a || !b) return null;
    const l1 = luminance(a), l2 = luminance(b);
    return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
  }
  function toLab(rgb) {
    const lin = rgb.map((v) => {
      v /= 255;
      return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    });
    const x = (lin[0] * 0.4124 + lin[1] * 0.3576 + lin[2] * 0.1805) / 0.95047;
    const y = lin[0] * 0.2126 + lin[1] * 0.7152 + lin[2] * 0.0722;
    const z = (lin[0] * 0.0193 + lin[1] * 0.1192 + lin[2] * 0.9505) / 1.08883;
    const f = (t) => (t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116);
    return [116 * f(y) - 16, 500 * (f(x) - f(y)), 200 * (f(y) - f(z))];
  }
  function deltaE(h1, h2) {
    const a = toLab(hexToRgb(h1)), b = toLab(hexToRgb(h2));
    return Math.sqrt((a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2 + (a[2] - b[2]) ** 2);
  }
  function nearestBrand(hex, kit) {
    let best = null;
    for (const p of kit.palette) {
      const d = deltaE(hex, p.hex);
      if (!best || d < best.d) best = { name: p.name, hex: p.hex, d };
    }
    return best;
  }
  /* A brand colour (or black/white) that passes AA against the background and stays closest to the current colour. */
  function suggestTextColor(fg, bg, large, kit) {
    const need = large ? 3 : 4.5;
    const brand = kit.palette.map((p) => ({ name: p.name, hex: p.hex }));
    const pools = [brand, [{ name: 'Black', hex: '#000000' }, { name: 'White', hex: '#FFFFFF' }]];
    for (const pool of pools) {
      const ok = pool.filter((c) => contrast(c.hex, bg) >= need);
      if (ok.length) {
        ok.sort((a, b) => (hexToRgb(fg) ? deltaE(fg, a.hex) - deltaE(fg, b.hex) : 0));
        return ok[0];
      }
    }
    return null;
  }

  /* Dominant colours from raw RGBA pixels (4 bits per channel buckets). */
  function paletteFromPixels(data) {
    const bins = new Map();
    let total = 0;
    for (let i = 0; i < data.length; i += 4) {
      if (data[i + 3] < 128) continue;
      const k = ((data[i] >> 4) << 8) | ((data[i + 1] >> 4) << 4) | (data[i + 2] >> 4);
      let b = bins.get(k);
      if (!b) bins.set(k, (b = { n: 0, r: 0, g: 0, b: 0 }));
      b.n++; b.r += data[i]; b.g += data[i + 1]; b.b += data[i + 2];
      total++;
    }
    const list = [...bins.values()]
      .map((b) => ({ hex: rgbToHex(b.r / b.n, b.g / b.n, b.b / b.n), share: b.n / (total || 1) }))
      .sort((a, b) => b.share - a.share);
    const top6 = list.slice(0, 6).reduce((n, c) => n + c.share, 0);
    const photographic = top6 < 0.6 || list.filter((c) => c.share >= 0.02).length >= 9;
    return { colors: list.slice(0, 6), photographic };
  }

  /* ---------- hashtag helper ---------- */
  const DICT = ('back to college budget budgeting lumo plus save smart money student students life campus spend clear calm free new launch ' +
    'offer deal sale tips fest day week hack hacks goal goals study exam exams semester hostel pocket month easy app india finance financial first ' +
    'internship stipend chai weekend monthly plan planning for with and the you your of in on my our is it up go get now best win join tracker track ' +
    'expense expenses needs wants savings invest wealth school class kit club team day night live fresh start').split(' ');
  function segment(s) {
    const n = s.length, best = new Array(n + 1).fill(null);
    best[0] = [];
    for (let i = 0; i < n; i++) {
      if (!best[i]) continue;
      for (const w of DICT) {
        if (s.startsWith(w, i) && (!best[i + w.length] || best[i].length + 1 < best[i + w.length].length)) best[i + w.length] = best[i].concat(w);
      }
    }
    return best[n];
  }

  /* ---------- text analysis ---------- */
  function analyze(text, kit, ctx) {
    ctx = ctx || {};
    const out = [];
    const add = (o) => out.push(F(o));
    const prot = protectedRanges(text);
    const stats = { factsChecked: 0, factsOk: 0, claimsApproved: 0, claimsFlagged: 0 };
    const brand = kit.brand;

    /* approved claims (used to suppress false alarms) */
    const approvedR = [];
    for (const c of kit.claims.filter((c) => c.status === 'approved')) {
      try {
        for (const m of text.matchAll(new RegExp(c.pattern, 'gi'))) {
          approvedR.push([m.index, m.index + m[0].length]);
          stats.claimsApproved++;
        }
      } catch (e) { /* bad pattern in kit: ignore */ }
    }

    /* terminology: glossary */
    for (const g of kit.glossary) {
      for (const w of g.wrong) {
        for (const m of text.matchAll(phraseRe(w))) {
          const s = m.index, e = s + m[0].length;
          if (overlaps(prot, s, e)) continue;
          add({
            rule: g.rule || 'TERM-GLO', severity: 'medium', start: s, end: e, text: m[0],
            title: 'Use “' + g.right + '” instead of “' + m[0] + '”',
            why: g.note || 'Approved terminology uses “' + g.right + '”.',
            clause: g.clause || 'T-2.1',
            fix: { kind: 'replace', text: matchCase(m[0], g.right) },
            keep: 'Same meaning, approved wording.', safe: true,
          });
        }
      }
    }
    /* terminology: brand capitalisation */
    if (brand.short) {
      const re = new RegExp('(?<![\\w#@./-])(' + escRe(brand.short.toLowerCase()) + '|' + escRe(brand.short.toUpperCase()) + ')(?![\\w.@/-])', 'g');
      for (const m of text.matchAll(re)) {
        add({
          rule: 'TERM-CAP', severity: 'low', start: m.index, end: m.index + m[0].length, text: m[0],
          title: 'Write the brand name as “' + brand.short + '”',
          why: 'The brand name is always written with a capital first letter and lowercase letters after it.',
          fix: { kind: 'replace', text: brand.short }, keep: 'Only the capitalisation changes.', safe: true,
        });
      }
    }

    /* tone: banned phrases */
    for (const b of kit.banned) {
      if (b.channels && b.channels.length && !b.channels.includes(ctx.channel)) continue;
      const rule = b.kind === 'jargon' ? 'TONE-JARGON' : b.kind === 'slang' ? 'TONE-SLANG' : 'TONE-HYPE';
      for (const m of text.matchAll(phraseRe(b.phrase))) {
        const s = m.index, e = s + m[0].length;
        if (overlaps(prot, s, e)) continue;
        add({
          rule, severity: 'low', start: s, end: e, text: m[0],
          title: '“' + m[0] + '” doesn’t match the brand voice',
          why: rule === 'TONE-HYPE' ? 'The voice is calm and plain. Hype words make claims sound bigger than we can prove.'
            : rule === 'TONE-JARGON' ? 'Corporate buzzwords make copy harder to read. Say it the way a helpful senior student would.'
            : 'This channel is formal. Slang is only for casual posts.',
          clause: rule === 'TONE-HYPE' ? 'V-1.2' : rule === 'TONE-JARGON' ? 'V-1.3' : 'V-1.4',
          fix: b.suggest ? { kind: 'replace', text: matchCase(m[0], b.suggest) } : null,
          keep: b.suggest ? 'Keeps the point of the sentence in plainer words.' : '',
        });
      }
    }
    /* tone: ALL CAPS runs */
    const capsAllow = new Set((kit.capsAllow || []).concat([brand.short ? brand.short.toUpperCase() : '']));
    for (const m of text.matchAll(/\b[A-Z]{3,}(?:\s+[A-Z]{2,})*\b/g)) {
      const s = m.index, e = s + m[0].length;
      if (overlaps(prot, s, e)) continue;
      const toks = m[0].split(/(\s+)/);
      if (toks.every((t) => /^\s+$/.test(t) || capsAllow.has(t))) continue;
      const before = text.slice(0, s).trimEnd();
      let atStart = !/[A-Za-z0-9,;:'"-]$/.test(before);
      const fixed = toks.map((t) => {
        if (/^\s+$/.test(t) || capsAllow.has(t)) return t;
        const low = t.toLowerCase();
        const r = atStart ? low[0].toUpperCase() + low.slice(1) : low;
        atStart = false;
        return r;
      }).join('');
      add({
        rule: 'TONE-CAPS', severity: 'low', start: s, end: e, text: m[0],
        title: 'Avoid ALL CAPS',
        why: 'Capital letters read as shouting and are harder for screen readers and dyslexic readers.',
        fix: { kind: 'replace', text: fixed }, keep: 'Same words, normal capitalisation.', safe: true,
      });
    }
    /* tone: exclamation marks */
    const words0 = (text.match(/[A-Za-z]+/g) || []).length;
    const allowEx = Math.max(1, Math.floor(words0 / 90));
    let seenEx = 0;
    for (const m of text.matchAll(/!+/g)) {
      seenEx++;
      if (m[0].length >= 2) {
        add({
          rule: 'TONE-EXCL', severity: 'low', start: m.index, end: m.index + m[0].length, text: m[0],
          title: 'Use a single exclamation mark',
          why: 'At most one exclamation mark per post. Repeated marks feel pushy.',
          fix: { kind: 'replace', text: '!' }, keep: 'Keeps the friendly energy.', safe: true,
        });
      } else if (seenEx > allowEx) {
        add({
          rule: 'TONE-EXCL', severity: 'low', start: m.index, end: m.index + 1, text: '!',
          title: 'Too many exclamation marks',
          why: 'At most one exclamation mark per post. Use a full stop for the rest.',
          fix: { kind: 'replace', text: '.' }, keep: 'Keeps the sentence, softens the tone.', safe: true,
        });
      }
    }

    /* claims: prohibited and approved register */
    for (const c of kit.claims.filter((c) => c.status === 'prohibited')) {
      let re;
      try { re = new RegExp(c.pattern, 'gi'); } catch (e) { continue; }
      for (const m of text.matchAll(re)) {
        const s = m.index, e = s + m[0].length;
        if (!m[0].trim() || overlaps(prot, s, e)) continue;
        let fix = null;
        if (typeof c.suggest === 'string') fix = c.suggest === '' ? { kind: 'delete' } : { kind: 'replace', text: matchCase(m[0], c.suggest) };
        stats.claimsFlagged++;
        add({
          rule: 'CLM-PRO', severity: 'high', sub: 'contradicts', start: s, end: e, text: m[0],
          title: 'Prohibited claim: “' + m[0] + '”',
          why: c.why || 'This kind of promise is on the prohibited list (' + c.id + '). It can mislead members and creates legal risk.',
          clause: 'C-4.2', fix, keep: fix ? 'Keeps the sentence, removes the promise.' : '',
        });
      }
    }
    /* claims: superlatives */
    const supRe = /(?<![\w])(?:the\s+)?(#\s?1|number one|no\.?\s?1|best|leading|fastest|most (?:trusted|popular|loved|secure|reliable)|top[- ]rated|world[- ]class|unbeatable|unmatched)(?![\w])/gi;
    for (const m of text.matchAll(supRe)) {
      let s = m.index, e = s + m[0].length;
      const word = m[1].toLowerCase();
      if (overlaps(prot, s, e) || overlaps(approvedR, s, e)) continue;
      const after = text.slice(e), before = text.slice(0, s);
      if (word === 'best' && (/^\s+(practice|practices|friend|wishes|regards|of luck)/i.test(after) || /\b(your|my|our|their|do|at)\s+$/i.test(before))) continue;
      let fix = { kind: 'delete' }, keep = 'Removes only the unproven ranking.';
      const rank = /^(#|number|no|best|leading|fastest|most|top)/.test(word);
      const m2 = after.match(/^\s+([A-Za-z][A-Za-z -]{1,32}?)(?=\s+(?:and|for|that|to|in|on|with|which|you|so)\b|[.,!?;:\n]|$)/);
      if (rank && m2 && m2[1].trim().split(/\s+/).length <= 4) {
        e += m2[0].length;
        fix = { kind: 'replace', text: 'a simple ' + m2[1].trim() };
        keep = 'Keeps what the product is, drops the unproven ranking.';
      }
      stats.claimsFlagged++;
      add({
        rule: 'CLM-SUP', severity: 'high', sub: 'unverified', start: s, end: e, text: text.slice(s, e).trim(),
        title: 'Unsupported claim: “' + text.slice(s, e).trim() + '”',
        why: 'Rankings and superlatives need an approved source in the Claims register. None exists for this one, so it can’t go out as written.',
        clause: 'C-4.1', fix, keep,
      });
    }
    /* claims: numeric performance figures */
    const numRes = [
      /\b(save|saves|saving|savings of|earn|earns|grow|grows|boost|boosts|cut|cuts|reduce|reduces|lower|lowers)\s+(?:you\s+|your\s+\w+\s+)?(?:up to\s+)?(?:by\s+)?(\d+(?:\.\d+)?)\s?%/gi,
      /\b(\d+(?:\.\d+)?)\s?%\s+(?:more|less|faster|better|savings|returns|cheaper)\b/gi,
    ];
    for (const re of numRes) {
      for (const m of text.matchAll(re)) {
        const s = m.index, e = s + m[0].length;
        if (overlaps(prot, s, e)) continue;
        const verb = (m[1] || '').toLowerCase();
        const money = /save|saving|earn|grow|boost|returns|cut|reduce|lower|cheaper|savings/.test(m[0].toLowerCase());
        const canFix = /^(save|saves|saving|cut|cuts|reduce|reduces|lower|lowers)/.test(verb);
        stats.claimsFlagged++;
        add({
          rule: 'CLM-NUM', severity: money ? 'high' : 'medium', sub: 'unverified', start: s, end: e, text: m[0],
          title: 'Unverified figure: “' + m[0] + '”',
          why: 'Numbers about savings or performance need a verified source in the Approved facts list. There is none for this figure.',
          clause: 'C-4.1',
          fix: canFix ? { kind: 'replace', text: 'helps you save' } : null,
          keep: canFix ? 'Keeps the benefit, drops the number we can’t prove.' : 'Remove the figure, or ask a Reviewer to add a verified source.',
        });
      }
    }
    /* claims: absolute promises */
    const absRe = /(?<![\w])(unlimited|free forever|completely free|totally free|never worry|zero effort|100\s?%(?!\s?(?:safe|secure))(?:\s+free)?)(?![\w])/gi;
    for (const m of text.matchAll(absRe)) {
      const s = m.index, e = s + m[0].length;
      if (overlaps(prot, s, e) || overlaps(approvedR, s, e)) continue;
      stats.claimsFlagged++;
      add({
        rule: 'CLM-ABS', severity: 'medium', sub: 'unverified', start: s, end: e, text: m[0],
        title: 'Absolute promise: “' + m[0] + '”',
        why: 'Words like “unlimited” and “free forever” are promises the product plan has to back up. Check them against the approved facts or soften them.',
        clause: 'C-4.1', fix: null, keep: 'Say what the plan really includes, for example the number of budgets.',
      });
    }

    /* facts */
    const fact = (k) => kit.facts.find((f) => f.key === k);
    const num = (n, unit) => {
      let v = parseFloat(String(n).replace(/,/g, ''));
      unit = (unit || '').trim().toLowerCase();
      if (unit === 'k') v *= 1e3;
      else if (unit === 'lakh' || unit === 'lakhs') v *= 1e5;
      else if (unit === 'm' || unit === 'million') v *= 1e6;
      return v;
    };
    const fp = fact('plusPrice');
    if (fp) {
      for (const m of text.matchAll(/(₹|rs\.?|inr)\s?(\d[\d,]*(?:\.\d+)?)(?=\s*(?:\/|per|a|each)?\s*(?:month|mo)\b)/gi)) {
        stats.factsChecked++;
        const v = num(m[2]);
        if (v === Number(fp.value)) { stats.factsOk++; continue; }
        add({
          rule: 'FACT-PRICE', severity: 'high', sub: 'contradicts', start: m.index, end: m.index + m[0].length, text: m[0],
          title: 'Price doesn’t match the approved fact',
          why: 'Approved: ₹' + fmtNum(fp.value) + ' per month. Your text says ' + m[0] + '. Source: ' + fp.source + '.',
          clause: fp.clause || 'F-5.1', fix: { kind: 'replace', text: '₹' + fmtNum(fp.value) }, keep: 'Same sentence with the current price.',
        });
      }
    }
    const fu = fact('userCount');
    if (fu) {
      const re = /(?:(over|more than|nearly|almost|about|around|up to)\s+)?(\d[\d,]*(?:\.\d+)?)(\s?(?:k|lakhs?|m|million)\b)?(\+)?(?=\s*(?:active\s+)?(?:students|users|members)\b)/gi;
      for (const m of text.matchAll(re)) {
        const v = num(m[2], m[3]);
        if (!(v >= 100)) continue;
        stats.factsChecked++;
        const appr = Number(fu.value);
        if (v >= appr * 0.9 && v <= appr * 1.02) { stats.factsOk++; continue; }
        const over = v > appr;
        add({
          rule: 'FACT-USERS', severity: over ? 'high' : 'medium', sub: over ? 'contradicts' : 'outdated', start: m.index, end: m.index + m[0].length, text: m[0],
          title: over ? 'Member count is higher than the approved figure' : 'Member count is out of date',
          why: 'Approved: ' + fmtNum(appr) + '+ students. Your text says ' + m[0].trim() + '. Source: ' + fu.source + '.',
          clause: fu.clause || 'F-5.1', fix: { kind: 'replace', text: fmtNum(appr) + '+' }, keep: 'Same claim with the verified number.',
        });
      }
    }
    const fy = fact('launchYear');
    if (fy) {
      for (const m of text.matchAll(/\b(launched|founded|started|since|established)(\s+in)?\s+(20\d{2})\b/gi)) {
        stats.factsChecked++;
        if (Number(m[3]) === Number(fy.value)) { stats.factsOk++; continue; }
        const s = m.index + m[0].lastIndexOf(m[3]);
        add({
          rule: 'FACT-YEAR', severity: 'high', sub: 'contradicts', start: s, end: s + 4, text: m[3],
          title: 'Launch year doesn’t match the approved fact',
          why: 'Approved: launched in ' + fy.value + '. Your text says ' + m[3] + '. Source: ' + fy.source + '.',
          clause: fy.clause || 'F-5.1', fix: { kind: 'replace', text: String(fy.value) }, keep: 'Same sentence with the correct year.',
        });
      }
    }
    const ff = fact('freeBudgets');
    if (ff) {
      for (const m of text.matchAll(/(\d+)(?=\s+free\s+budgets?\b)/gi)) {
        stats.factsChecked++;
        if (Number(m[1]) === Number(ff.value)) { stats.factsOk++; continue; }
        add({
          rule: 'FACT-FREE', severity: 'high', sub: 'contradicts', start: m.index, end: m.index + m[0].length, text: m[0],
          title: 'Free plan limit doesn’t match the approved fact',
          why: 'Approved: ' + ff.value + ' free budgets. Source: ' + ff.source + '.',
          clause: ff.clause || 'F-5.1', fix: { kind: 'replace', text: String(ff.value) }, keep: 'Same sentence with the correct limit.',
        });
      }
    }
    const ft = fact('trialDays');
    if (ft) {
      for (const m of text.matchAll(/(\d+)(?=[- ]day\s+(?:free\s+)?trial)/gi)) {
        stats.factsChecked++;
        if (Number(m[1]) === Number(ft.value)) { stats.factsOk++; continue; }
        add({
          rule: 'FACT-TRIAL', severity: 'high', sub: 'contradicts', start: m.index, end: m.index + m[0].length, text: m[0],
          title: 'Trial length doesn’t match the approved fact',
          why: 'Approved: ' + ft.value + '-day free trial. Source: ' + ft.source + '.',
          clause: ft.clause || 'F-5.1', fix: { kind: 'replace', text: String(ft.value) }, keep: 'Same sentence with the correct trial length.',
        });
      }
    }

    /* messaging: required disclaimers */
    for (const d of kit.disclaimers) {
      let trig, ok;
      try { trig = text.match(new RegExp(d.trigger, 'i')); ok = new RegExp(d.test, 'i').test(text); } catch (e) { continue; }
      if (trig && !ok) {
        add({
          rule: d.rule, severity: d.severity || 'medium', start: trig.index, end: trig.index + trig[0].length, text: trig[0],
          title: d.title, why: d.why, clause: d.clause,
          fix: { kind: 'append', text: d.required, sep: '\n\n' }, keep: 'Adds the required line at the end. Your message is unchanged.',
        });
      }
    }
    /* messaging: full product name on first mention */
    if ((brand.fullNameChannels || []).includes(ctx.channel) && brand.full) {
      const re = new RegExp('(?<![\\w#@./-])' + escRe(brand.short) + '(?!\\s+(?:Budget|Plus)\\b)(?![\\w.@/-])', 'g');
      const first = [...text.matchAll(re)][0];
      if (first && !new RegExp(escRe(brand.full)).test(text)) {
        add({
          rule: 'MSG-NAME', severity: 'low', start: first.index, end: first.index + first[0].length, text: first[0],
          title: 'Use “' + brand.full + '” on first mention',
          why: 'In ' + ctx.channel.toLowerCase() + ' copy the full product name appears first, then “' + brand.short + '” is fine.',
          clause: 'M-3.3', fix: { kind: 'replace', text: brand.full }, keep: 'Only adds the full name.', safe: true,
        });
      }
    }

    /* confidentiality */
    const piiDefs = [
      [/\b\d{4}\s\d{4}\s\d{4}\b/g, 'a 12-digit ID number'],
      [/\b(?:\d[ -]?){13,16}\b/g, 'a card-like number'],
      [/(?<![\w@])(?:\+?91[\s-]?)?[6-9]\d{9}\b/g, 'a phone number'],
      [/\b[\w.+-]+@[\w-]+(?:\.[\w-]+)+/g, 'an email address'],
      [/\b(confidential|internal only|do not share|not for release|embargo(?:ed)?)\b/gi, 'a confidentiality marking'],
    ];
    const piiKept = [];
    for (const [re, label] of piiDefs) {
      for (const m of text.matchAll(re)) {
        const s = m.index, e = s + m[0].length;
        if ((kit.allowedEmails || []).includes(m[0].toLowerCase())) continue;
        if (piiKept.some(([a, b]) => s < b && e > a)) continue;
        piiKept.push([s, e]);
        add({
          rule: 'CONF-PII', severity: 'high', noDismiss: true, start: s, end: e, text: m[0],
          title: 'Contains ' + label,
          why: 'Public content must not include personal data or material marked confidential. This finding can’t be dismissed, only fixed.',
          clause: 'P-8.1', fix: { kind: 'delete' }, keep: 'Removes only the sensitive text.',
        });
      }
    }

    /* accessibility */
    const rd = readability(text);
    if (rd.words >= 25 && rd.score < 50) {
      add({
        rule: 'A11Y-READ', severity: 'medium', text: 'Reading ease ' + rd.score, title: 'Hard to read: reading ease ' + rd.score + ' (target 60+)',
        why: 'Long sentences and long words make the text hard to read for many members. Aim for a reading ease of 60 or more.',
        clause: 'A-6.1', keep: 'Split long sentences and swap long words for short ones.',
      });
    }
    for (const s of sentences(text)) {
      const wc = (s.text.match(/[A-Za-z0-9'’-]+/g) || []).length;
      if (wc > 28) {
        add({
          rule: 'A11Y-LONG', severity: 'low', start: s.start, end: s.end, text: s.text,
          title: 'Very long sentence (' + wc + ' words)',
          why: 'Keep sentences under 25 words so they are easy to follow and easy to read aloud.', clause: 'A-6.1', keep: 'Split it into two sentences.',
        });
      }
    }
    for (const m of text.matchAll(/#[A-Za-z][A-Za-z0-9]*/g)) {
      const tag = m[0].slice(1);
      if (tag !== tag.toLowerCase() || tag.length < 9) continue;
      const seg = segment(tag.toLowerCase());
      const cap = (w) => w[0].toUpperCase() + w.slice(1);
      if (seg && seg.length > 1) {
        add({
          rule: 'A11Y-HASH', severity: 'low', start: m.index, end: m.index + m[0].length, text: m[0],
          title: 'Write hashtags in CamelCase',
          why: 'Screen readers read #' + tag + ' as one long word. CamelCase lets them read each word.',
          fix: { kind: 'replace', text: '#' + seg.map(cap).join('') }, keep: 'Same hashtag, easier to read.', safe: true,
        });
      } else if (!seg && tag.length >= 12) {
        add({
          rule: 'A11Y-HASH', severity: 'low', start: m.index, end: m.index + m[0].length, text: m[0],
          title: 'Write hashtags in CamelCase',
          why: 'Capitalise each word so screen readers can read it.', keep: 'Same hashtag with capital letters at each word.',
        });
      }
    }
    for (const m of text.matchAll(/\b(click|tap)\s+here(\s+to\s+(\w))?|\bread more\b/gi)) {
      const fix = m[3] ? { kind: 'replace', text: m[3].toUpperCase() } : null;
      add({
        rule: 'A11Y-LINK', severity: 'low', start: m.index, end: m.index + m[0].length, text: m[0],
        title: 'Use descriptive link text',
        why: 'Screen reader users often jump from link to link. “' + m[0] + '” says nothing about where it leads.',
        fix, keep: fix ? 'Starts the sentence with the action.' : 'Name the destination, for example “Join Lumo Plus”.',
      });
    }
    const run = text.match(/(?:\p{Extended_Pictographic}️?){3,}/u);
    if (run) {
      const first = run[0].match(/^\p{Extended_Pictographic}️?/u)[0];
      add({
        rule: 'A11Y-EMOJI', severity: 'low', start: run.index, end: run.index + run[0].length, text: run[0],
        title: 'Too many emoji in a row',
        why: 'Screen readers read out every emoji by name. Keep it to one or two.',
        fix: { kind: 'replace', text: first }, keep: 'Keeps one emoji for tone.', safe: true,
      });
    }

    return { findings: dedupe(out), stats: Object.assign(stats, { reading: rd.score, words: rd.words }) };
  }

  /* keep the strongest finding when two of the same category overlap */
  function dedupe(list) {
    const sorted = list.slice().sort((a, b) => SEV[b.severity] - SEV[a.severity] || b.end - b.start - (a.end - a.start));
    const kept = [];
    for (const f of sorted) {
      if (f.start >= 0 && kept.some((k) => k.start >= 0 && k.category === f.category && f.start < k.end && f.end > k.start)) continue;
      kept.push(f);
    }
    return kept.sort((a, b) => (a.start < 0) - (b.start < 0) || a.start - b.start);
  }

  /* ---------- visual details ---------- */
  function analyzeVisual(v, kit) {
    const out = [];
    if (!v) return out;
    const add = (o) => out.push(F(o));
    if (v.hasImage) {
      const alt = (v.alt || '').trim();
      if (!alt) {
        add({ rule: 'A11Y-ALT', severity: 'high', text: 'missing alt text', title: 'Image has no alt text',
          why: 'People who use screen readers get nothing from an image without alt text. Describe what the image shows and why it is there.',
          clause: 'A-6.2', keep: 'Write one short sentence, for example “Students at a campus stall comparing budget plans.”', field: 'alt' });
      } else if (alt.split(/\s+/).length < 4 || /^(image|photo|picture|graphic)\s+of\b/i.test(alt)) {
        add({ rule: 'A11Y-ALT', severity: 'medium', text: 'weak alt text', title: 'Alt text is too short or starts with “image of”',
          why: 'Screen readers already announce that it is an image. Say what it shows in at least four words.', clause: 'A-6.2',
          keep: 'Describe the content and purpose.', field: 'alt' });
      }
    }
    if (v.fg && v.bg && hexToRgb(v.fg) && hexToRgb(v.bg)) {
      const ratio = contrast(v.fg, v.bg), need = v.large ? 3 : 4.5;
      if (ratio < need) {
        const sg = suggestTextColor(v.fg, v.bg, v.large, kit);
        add({ rule: 'A11Y-CON', severity: ratio < 3 ? 'high' : 'medium', text: 'contrast ' + ratio.toFixed(2),
          title: 'Text colour contrast is ' + ratio.toFixed(2) + ':1 (needs ' + need + ':1)',
          why: v.fg.toUpperCase() + ' on ' + v.bg.toUpperCase() + ' is hard to read, especially on a phone in daylight.',
          clause: 'A-6.3', fix: sg ? { kind: 'visual', set: { fg: sg.hex }, text: sg.name + ' ' + sg.hex } : null,
          keep: sg ? 'Uses the brand colour closest to your current one that passes.' : 'Pick a darker or lighter text colour.' });
      }
    }
    if (v.logo && v.logo !== 'none') {
      const bgRgb = hexToRgb(v.bg || '');
      const lum = bgRgb ? luminance(bgRgb) : null;
      if (v.logo === 'old') {
        add({ rule: 'VIS-LOGO', severity: 'high', text: 'retired logo', title: 'Retired 2022 logo in use',
          why: 'The 2022 logo was retired. Use the current full-colour logo on light backgrounds or the white logo on dark ones.', clause: 'VI-7.2',
          fix: { kind: 'visual', set: { logo: lum !== null && lum < 0.35 ? 'mono' : 'full' }, text: lum !== null && lum < 0.35 ? 'White logo' : 'Full-colour logo' },
          keep: 'Swaps the logo file only.' });
      } else if (v.logo === 'altered') {
        add({ rule: 'VIS-LOGO', severity: 'high', text: 'altered logo', title: 'Logo has been stretched or recoloured',
          why: 'The logo is never stretched, rotated or recoloured.', clause: 'VI-7.2',
          fix: { kind: 'visual', set: { logo: lum !== null && lum < 0.35 ? 'mono' : 'full' }, text: 'Original logo' }, keep: 'Uses the supplied logo file.' });
      } else if (v.logo === 'full' && lum !== null && lum < 0.35) {
        add({ rule: 'VIS-LOGO', severity: 'medium', text: 'full-colour on dark', title: 'Full-colour logo on a dark background',
          why: 'On dark backgrounds use the white version of the logo.', clause: 'VI-7.2',
          fix: { kind: 'visual', set: { logo: 'mono' }, text: 'White logo' }, keep: 'Swaps the logo file only.' });
      } else if (v.logo === 'mono' && lum !== null && lum > 0.6) {
        add({ rule: 'VIS-LOGO', severity: 'medium', text: 'white logo on light', title: 'White logo on a light background',
          why: 'The white logo disappears on light backgrounds. Use the full-colour version.', clause: 'VI-7.2',
          fix: { kind: 'visual', set: { logo: 'full' }, text: 'Full-colour logo' }, keep: 'Swaps the logo file only.' });
      }
    }
    if (v.hasImage && v.palette && v.palette.colors && !v.palette.photographic) {
      for (const c of v.palette.colors) {
        if (c.share < 0.12) continue;
        const nb = nearestBrand(c.hex, kit);
        if (nb.d > 18) {
          add({ rule: 'VIS-PAL', severity: 'medium', text: 'off-palette ' + c.hex, title: 'Off-brand colour ' + c.hex + ' covers ' + Math.round(c.share * 100) + '% of the image',
            why: 'The brand palette has four colours. The closest is ' + nb.name + ' ' + nb.hex + ', and it is still clearly different (ΔE ' + Math.round(nb.d) + ').',
            clause: 'VI-7.1', keep: 'Recolour the design with ' + nb.name + ' ' + nb.hex + ' or another palette colour.' });
        }
      }
    }
    return out;
  }

  /* ---------- AI second opinion ---------- */
  function maskPII(text) {
    return text
      .replace(/\b\d{4}\s\d{4}\s\d{4}\b/g, '[ID NUMBER]')
      .replace(/\b(?:\d[ -]?){13,16}\b/g, '[CARD NUMBER]')
      .replace(/(?<![\w@])(?:\+?91[\s-]?)?[6-9]\d{9}\b/g, '[PHONE]')
      .replace(/\b[\w.+-]+@[\w-]+(?:\.[\w-]+)+/g, '[EMAIL]');
  }

  function validateAI(raw, text, kit) {
    const ids = new Set(kit.clauses.map((c) => c.id));
    const ok = [], dropped = [];
    for (const r of Array.isArray(raw) ? raw : []) {
      const why = !r || typeof r.span !== 'string' || !r.span.trim() ? 'No quoted text'
        : text.indexOf(r.span) < 0 ? 'Quoted text is not in the draft'
        : !ids.has(r.clauseId) ? 'Cites a guideline that does not exist'
        : typeof r.reason !== 'string' || !r.reason.trim() ? 'No explanation' : null;
      if (why) { dropped.push({ span: r && r.span, why }); continue; }
      ok.push({
        span: r.span, clauseId: r.clauseId,
        category: CATEGORIES.includes(r.category) ? r.category : 'tone',
        severity: SEV[r.severity] ? r.severity : 'medium',
        reason: r.reason.trim(), suggestion: typeof r.suggestion === 'string' ? r.suggestion : '',
        confidence: Math.max(0, Math.min(1, Number(r.confidence) || 0.5)),
      });
    }
    return { ok, dropped };
  }

  function aiToFindings(items, text) {
    const out = [];
    for (const it of items || []) {
      const s = text.indexOf(it.span);
      if (s < 0) continue;
      const low = it.confidence < 0.6;
      out.push(F({
        rule: 'AI-REV', source: 'ai', category: it.category, clause: it.clauseId, severity: low ? 'low' : it.severity,
        start: s, end: s + it.span.length, text: it.span, conf: it.confidence, lowConf: low,
        title: it.reason.length > 90 ? it.reason.slice(0, 87) + '…' : it.reason, why: it.reason,
        fix: it.suggestion && it.suggestion !== it.span ? { kind: 'replace', text: it.suggestion } : null,
        keep: 'Suggested by the AI to fit your goal. Review before using.',
      }));
    }
    return out;
  }

  /* ---------- apply a fix ---------- */
  function applyFix(text, f) {
    const fx = f.fix;
    if (!fx) return text;
    if (fx.kind === 'append') return text.replace(/\s+$/, '') + (fx.sep !== undefined ? fx.sep : '\n\n') + fx.text;
    if (fx.kind !== 'replace' && fx.kind !== 'delete') return text;
    let before = text.slice(0, f.start), after = text.slice(f.end);
    if (fx.kind === 'delete') {
      if (/\s$/.test(before) && /^\s/.test(after)) after = after.replace(/^\s+/, '');
      else if (/\s$/.test(before) && /^[.,!?;:]/.test(after)) before = before.replace(/\s+$/, '');
      if (/(^|[.!?\n]\s*)$/.test(before) && /^[a-z]/.test(after)) after = after[0].toUpperCase() + after.slice(1);
      return before + after;
    }
    return before + fx.text + after;
  }

  /* ---------- word diff ---------- */
  function diffWords(a, b) {
    const ta = a.match(/\s+|[\w’'-]+|[^\w\s]/g) || [], tb = b.match(/\s+|[\w’'-]+|[^\w\s]/g) || [];
    const n = ta.length, m = tb.length;
    const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
      dp[i][j] = ta[i] === tb[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    const ops = [];
    let i = 0, j = 0;
    const push = (t, v) => { const l = ops[ops.length - 1]; if (l && l.t === t) l.v += v; else ops.push({ t, v }); };
    while (i < n && j < m) {
      if (ta[i] === tb[j]) { push('eq', ta[i]); i++; j++; }

  const seen = {};
  findings.forEach((f) => {
    f.decision = sub.decisions[f.key] || null;
    seen[f.id] = (seen[f.id] || 0) + 1;
    if (seen[f.id] > 1) f.id += '#' + seen[f.id];
  });
  const open = findings.filter((f) => !f.decision);
  const res = {
    sig, findings, stats: base.stats,
    open, openHigh: open.filter((f) => f.severity === 'high'),
    count: { high: open.filter((f) => f.severity === 'high').length, medium: open.filter((f) => f.severity === 'medium').length, low: open.filter((f) => f.severity === 'low').length },
    needsAck: findings.filter((f) => f.decision && f.severity === 'high' && !f.decision.ack),
  };
  cache.set(sub.id, res);
  return res;
}

/* ----- files in ----- */
function stripHtml(h) {
  const d = new DOMParser().parseFromString(h.replace(/<br\s*\/?>/gi, '\n').replace(/<\/(p|div|h\d|li|tr)>/gi, '\n'), 'text/html');
  d.querySelectorAll('script,style').forEach((n) => n.remove());
  return (d.body.textContent || '').replace(/\n{3,}/g, '\n\n').trim();
}
async function readDocx(file) {
  const buf = await file.arrayBuffer(), dv = new DataView(buf);
  let i = buf.byteLength - 22;
  while (i >= 0 && dv.getUint32(i, true) !== 0x06054b50) i--;
  if (i < 0) throw new Error('Not a .docx file');
  const count = dv.getUint16(i + 10, true);
  let p = dv.getUint32(i + 16, true);
  for (let n = 0; n < count; n++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), elen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true), lho = dv.getUint32(p + 42, true);
    const name = new TextDecoder().decode(new Uint8Array(buf, p + 46, nlen));
    if (name === 'word/document.xml') {
      const start = lho + 30 + dv.getUint16(lho + 26, true) + dv.getUint16(lho + 28, true);
      const raw = new Uint8Array(buf, start, csize);
      let xml;
      if (method === 0) xml = new TextDecoder().decode(raw);
      else xml = await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
      return xml.replace(/<\/w:p>/g, '\n').replace(/<w:tab\/>/g, '\t').replace(/<w:br\/>/g, '\n').replace(/<[^>]+>/g, '')
        .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, '&').trim();
    }
    p += 46 + nlen + elen + clen;
  }
  throw new Error('No text found in this .docx');
}
async function readTextFile(file) {
  const n = file.name.toLowerCase();
  if (n.endsWith('.docx')) return readDocx(file);
  const t = await file.text();
  if (n.endsWith('.html') || n.endsWith('.htm')) return stripHtml(t);
  return t.trim();
}

/* ----- images ----- */
function processImage(src) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const w = Math.min(96, img.width), h = Math.max(1, Math.round((img.height * w) / img.width));
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const x = c.getContext('2d', { willReadFrequently: true });
      x.drawImage(img, 0, 0, w, h);
      const palette = E.paletteFromPixels(x.getImageData(0, 0, w, h).data);
      const tw = 240, th = Math.max(1, Math.round((img.height * tw) / img.width));
      const c2 = document.createElement('canvas');
      c2.width = tw; c2.height = th;
      c2.getContext('2d').drawImage(img, 0, 0, tw, th);
      res({ palette, thumb: c2.toDataURL('image/jpeg', 0.72) });
    };
    img.onerror = () => rej(new Error('Could not read this image'));
    img.src = src;
  });
}

let sampleFn;
async function getSample() {

function buildPrompt(sub, A) {
  const clauses = D.kit.clauses.map((c) => c.id + ' ' + c.title + ': ' + c.text).join('\n');
  const facts = D.kit.facts.map((f) => f.label + ' = ' + f.value).join('\n');
  const known = A.findings.filter((f) => f.source === 'rule' && f.start >= 0).map((f) => '- ' + f.rule + ': "' + f.text + '"').slice(0, 30).join('\n') || '- none';
  return [
    'You are a careful brand-compliance reviewer for the brand "' + D.kit.name + '". You are the SECOND reviewer: a rule engine already ran.',
    'Find issues the rules cannot catch: a tone that does not fit the goal, misleading implications, confusing wording, claims implied but not stated.',
    'You may only flag issues that a guideline clause below justifies.',
    '', 'GUIDELINE CLAUSES:', clauses, '', 'APPROVED FACTS:', facts, '',
    'ALREADY FOUND BY RULES (do not repeat):', known, '',
    'CHANNEL: ' + sub.channel, 'CREATOR\'S GOAL: ' + (sub.goal || 'not stated'), '',
    'DRAFT (between the markers):', '<<<', E.maskPII(sub.draft), '>>>', '',
    'Return ONLY a JSON array with at most 5 items, no other text. Each item:',
    '{"span": exact text copied from the draft, "clauseId": one of the clause ids above, "category": one of tone|terminology|messaging|facts|claims|accessibility|visual,',
    ' "severity": "high"|"medium"|"low", "reason": one plain sentence saying why it breaks that clause,',
    ' "suggestion": replacement for the span that keeps the creator\'s goal, or "" if none, "confidence": number from 0 to 1}',
    'If you find nothing, return [].',
  ].join('\n');
}
async function runAI(sub) {
  const sample = await getSample();
  if (!sample) { UI.ai = { id: sub.id, status: 'unavailable' }; return; }
  const A = analysis(sub);
  UI.ai = { id: sub.id, status: 'running' };
  render();
  try {
    const res = await sample(buildPrompt(sub, A), { cache: false });
    const m = (res.text || '').match(/\[[\s\S]*\]/);
    if (!m) throw new Error('The AI did not return a list');
    const raw = JSON.parse(m[0]);
    const v = E.validateAI(raw, sub.draft, D.kit);
    sub.ai = { items: v.ok, at: Date.now(), dropped: v.dropped.length };
    log(sub, 'ai', 'AI second opinion: ' + v.ok.length + ' finding' + (v.ok.length === 1 ? '' : 's') + ' kept, ' + v.dropped.length + ' discarded (no valid source)');
    tourMark('ai');
    UI.ai = { id: sub.id, status: 'done', kept: v.ok.length, dropped: v.dropped };
  } catch (e) {
    UI.ai = { id: sub.id, status: 'error', msg: e && e.code === 'not_granted' ? 'Permission to use the AI was not given.' : e && e.code === 'rate_limited' ? 'The AI is busy. Try again in a minute.' : (e && e.message) || 'The AI call failed.' };

function insights() {
  const ev = D.events;
  const byCat = {}, byRule = {}, weeks = new Array(6).fill(0);
  ev.forEach((e) => {
    const meta = E.RULES[e.rule] || {};
    const cat = meta.category || 'tone';
    byCat[cat] = (byCat[cat] || 0) + 1;
    const r = (byRule[e.rule] = byRule[e.rule] || { rule: e.rule, n: 0, dis: 0, teams: {} });
    r.n++;
    if (e.outcome === 'dismissed') r.dis++;
    r.teams[e.team] = (r.teams[e.team] || 0) + 1;
    weeks[e.w] = (weeks[e.w] || 0) + 1;
  });
  const rules = Object.values(byRule).map((r) => {
    const top = Object.entries(r.teams).sort((a, b) => b[1] - a[1])[0];
    return Object.assign(r, { rate: r.n ? r.dis / r.n : 0, team: top ? top[0] : '-', meta: E.RULES[r.rule] || { label: r.rule, clause: '' } });
  });
  const total = ev.length, dis = ev.filter((e) => e.outcome === 'dismissed').length;
  return { byCat, rules, weeks, total, dis, fixed: total - dis };
}

  ranged.forEach((f) => { b.add(f.start); b.add(f.end); });
  const pts = [...b].sort((x, y) => x - y);
  let html = '';
  for (let i = 0; i < pts.length - 1; i++) {
    const s = pts[i], e = pts[i + 1], seg = text.slice(s, e);
    const cov = ranged.filter((f) => f.start <= s && f.end >= e);

  }
  return html;
}

function fixPreview(f) {
  const fx = f.fix;
  if (!fx) return '';
  const b = f.text ? '<del>' + esc(trunc(f.text, 70)) + '</del>' : '';
  if (fx.kind === 'replace') return '<div class="ba">' + b + '<span class="arr">→</span><ins>' + esc(trunc(fx.text, 80)) + '</ins></div>';
  if (fx.kind === 'delete') return '<div class="ba">' + b + '<span class="arr">→</span><ins class="gone">remove</ins></div>';
  if (fx.kind === 'append') return '<div class="ba"><span class="muted small">Add at the end</span><span class="arr">→</span><ins>' + esc(fx.text) + '</ins></div>';
  if (fx.kind === 'visual') return '<div class="ba"><span class="muted small">Change to</span><span class="arr">→</span><ins>' + esc(fx.text) + '</ins></div>';

}

/* ---------- insights ---------- */
function barChart(data) {
  const rows = Object.entries(data).sort((a, b) => b[1] - a[1]);
  const max = Math.max.apply(null, rows.map((r) => r[1]).concat(1));
  const H = rows.length * 30 + 6;
  return '<svg viewBox="0 0 560 ' + H + '" class="chart" role="img" aria-label="Issues caught by category">' + rows.map(([k, v], i) => {
    const y = i * 30 + 4, w = Math.max(3, (v / max) * 360);
    return '<text x="0" y="' + (y + 16) + '" class="ct">' + CAT_LABEL[k] + '</text><rect x="120" y="' + y + '" width="' + w + '" height="20" rx="3" class="bar"/><text x="' + (128 + w) + '" y="' + (y + 15) + '" class="cv">' + v + '</text>';
  }).join('') + '</svg>';
}
function trendChart(weeks) {
  const W = 560, Ht = 190, l = 30, r = 16, t = 20, bt = 28;
  const max = Math.ceil(Math.max.apply(null, weeks.concat(1)) / 10) * 10;
  const x = (i) => l + (i * (W - l - r)) / (weeks.length - 1), y = (v) => t + (1 - v / max) * (Ht - t - bt);
  const pts = weeks.map((v, i) => x(i) + ',' + y(v)).join(' ');
  const area = l + ',' + y(0) + ' ' + pts + ' ' + x(weeks.length - 1) + ',' + y(0);
  const labels = ['6 wks ago', '5 wks', '4 wks', '3 wks', '2 wks', 'Now'];
  return '<svg viewBox="0 0 ' + W + ' ' + Ht + '" class="chart" role="img" aria-label="Issues caught per week: ' + weeks.join(', ') + '">' +
    [0, max / 2, max].map((v) => '<line x1="' + l + '" x2="' + (W - r) + '" y1="' + y(v) + '" y2="' + y(v) + '" class="grid"/><text x="0" y="' + (y(v) + 4) + '" class="ct s">' + v + '</text>').join('') +
    '<polygon points="' + area + '" class="area"/><polyline points="' + pts + '" class="line" fill="none"/>' +
    weeks.map((v, i) => '<circle cx="' + x(i) + '" cy="' + y(v) + '" r="' + (i === weeks.length - 1 ? 5 : 3) + '" class="dot' + (i === weeks.length - 1 ? ' last' : '') + '"/><text x="' + x(i) + '" y="' + (y(v) - 9) + '" text-anchor="middle" class="cv s">' + v + '</text><text x="' + x(i) + '" y="' + (Ht - 8) + '" text-anchor="middle" class="ct s">' + labels[i] + '</text>').join('') + '</svg>';
}
function viewInsights() {
  const I = insights();
  const approved = D.subs.filter((s) => s.status === 'approved').length;
  const rules = I.rules.slice();
  const repeat = rules.slice().sort((a, b) => b.n - a.n).slice(0, 8);
  const unclear = rules.filter((r) => r.n >= 5 && r.rate >= 0.5).sort((a, b) => b.rate - a.rate);
  const reviewsTot = K.SEED_REVIEWS_PER_WEEK.reduce((a, b) => a + b, 0) + D.subs.length;
  return '<div class="wrap"><div class="page-h"><div><h1>Governance insights</h1><p class="muted">What goes wrong most often, and which guidelines people keep overriding. Includes six weeks of sample history from the demo workspace, plus everything you do here.</p></div></div>' +
    '<div class="kpis"><div><b>' + I.total + '</b><span>issues caught before publishing</span></div><div><b>' + Math.round((I.fixed / I.total) * 100) + '%</b><span>fixed rather than dismissed</span></div><div><b>' + Math.round(K.SEED_CLEAN_RATE[5] * 100) + '%</b><span>of reviews clean on first check (was ' + Math.round(K.SEED_CLEAN_RATE[0] * 100) + '% six weeks ago)</span></div><div><b>' + reviewsTot + '</b><span>reviews checked · ' + approved + ' approved in this demo</span></div></div>' +
    '<div class="two-c"><section class="card"><h3>Issues caught by category</h3>' + barChart(I.byCat) + '</section><section class="card"><h3>Issues caught per week</h3>' + trendChart(I.weeks) + '</section></div>' +
    '<section class="card"><div class="card-h"><h3>Guidelines that may be unclear</h3><span class="muted small">Rules dismissed at least half the time, with 5 or more hits</span></div>' +
    (unclear.length ? '<div class="tw"><table><thead><tr><th>Rule</th><th>Clause</th><th>Dismissed</th><th>What to do</th></tr></thead><tbody>' + unclear.map((r) => '<tr><td><b>' + esc(r.meta.label) + '</b><br><span class="mono muted small">' + r.rule + '</span></td><td><button class="lnk" data-act="openClause" data-c="' + r.meta.clause + '">' + r.meta.clause + '</button></td><td><span class="rate"><i style="width:' + Math.round(r.rate * 100) + '%"></i></span> ' + r.dis + ' of ' + r.n + ' (' + Math.round(r.rate * 100) + '%)</td><td>Creators keep overriding this. Add a clear example or an exception to clause ' + r.meta.clause + ', or relax the rule.</td></tr>').join('') + '</tbody></table></div>' : '<p class="empty">No unclear guidelines right now.</p>') + '</section>' +
    '<section class="card"><div class="card-h"><h3>Repeat mistakes</h3><span class="muted small">Most frequent findings across all teams</span></div><div class="tw"><table><thead><tr><th>Rule</th><th>Times caught</th><th>Most affected team</th><th>Dismissed</th></tr></thead><tbody>' +
    repeat.map((r) => '<tr><td><b>' + esc(r.meta.label) + '</b><br><span class="mono muted small">' + r.rule + '</span></td><td>' + r.n + '</td><td>' + esc(r.team) + '</td><td>' + Math.round(r.rate * 100) + '%</td></tr>').join('') + '</tbody></table></div></section></div>';
}

const $ = (s, r) => (r || document).querySelector(s);
const curSub = () => getSub(UI.sel);
const findById = (sub, id) => analysis(sub).findings.find((f) => f.id === id);
const findByKey = (sub, key) => analysis(sub).findings.find((f) => f.key === key);
